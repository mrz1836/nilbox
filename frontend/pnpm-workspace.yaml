# Supply-chain policy for the desktop frontend. Every setting here applies to every
# install: local, CI, and the frontend gate.

# A release must be at least seven days old (in minutes) before pnpm installs it, so a
# compromised publish has time to be noticed and pulled before it reaches this project.
minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  # The desktop runtime ships in lockstep with the pinned Go module
  # (github.com/wailsapp/wails/v3 v3.1.0), and 3.1.0 was published inside the
  # release-age window. The exclusion names that exact version, and package.json
  # pins it exactly, so no other release can slip through.
  - '@wailsio/runtime@3.1.0'

# Each override closes a published advisory in a transitive dependency that its parent
# has not picked up yet. Every entry names the advisory, its scope, and when to drop it.
overrides:
  # minimatch 10.x is affected by a moderate denial-of-service advisory
  # (GHSA-g3hv-75wg-m249), fixed in 11.0.1 with no 10.x backport. The TypeScript ESLint
  # parser still asks for ^10.2.2 and calls only the named minimatch() export, which 11.x
  # keeps unchanged. Lint-only tooling, never bundled into the app. Drop this entry once
  # the parser depends on minimatch 11 itself.
  '@typescript-eslint/typescript-estree>minimatch': 11.0.3

# Build (install) scripts run only for packages listed here as true. Anything not
# reviewed and listed fails the install, so a new build script is always a decision.
allowBuilds: {}

audit:
  # Advisories are fixed by upgrading, not ignored. An entry here needs a written reason.
  ignore: []
