# ------------------------------------------------------------------------------------
#  Frontend
#
#  Purpose: Run the desktop frontend gate (frozen-lockfile install, format check,
#  lint, typecheck, and tests with coverage) on an ubuntu runner.
#
#  The gate itself lives in frontend/scripts/gate.sh, the same script the local
#  `magex frontend:gate` target runs, so CI and local checks cannot drift apart.
# ------------------------------------------------------------------------------------

name: Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Frontend gate
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from frontend/package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js (version from frontend/.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Run the frontend gate
        run: bash frontend/scripts/gate.sh
