# ────────────────────────────────────────────────────────────────
# Dependabot Configuration
#
# Purpose:
#   • Keep GitHub Actions updated with the latest security patches and features.
#   • Reduce attack surface by limiting outdated dependencies.
#   • Minimise PR noise via smart grouping and sane pull‑request limits.
#
# References:
#   https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#   https://docs.github.com/en/code-security/dependabot/configuration-options-for-dependency-updates
#
# Security Hardened Defaults:
#   • Weekly cadence (Wednesday 11:00 America/New_York) – align with typical maintenance windows.
#   • Direct dependencies only – prevents unsolicited transitive churn.
#   • PRs labeled, assigned, and target the protected master branch.
#   • PR titles prefixed with chore(scope): – conventional commits.
#   • Force‑push and delete‑branch disabled via branch‑protection rules.
#   • PR limit = 10 to avoid queue flooding.
#   • All dependency PRs require passing CI checks before merging.
#   • Cooldown on version updates – new releases must age 3 days (gomod: patch 3 / minor 7 / major 14)
#     before a PR opens; npm (/frontend) waits 7 days (patch 7 / minor 7 / major 14) to match
#     pnpm's 7-day minimumReleaseAge. Trusted publishers are excluded. Security updates are never delayed.
#   • npm (/frontend) ignores the major versions its toolchain can't take yet; each entry names its
#     blocker and when to drop it.
# ────────────────────────────────────────────────────────────────

version: 2

updates:
  # ──────────────────────────────────────────────────────────────
  # 1. Go Modules (go.mod / go.sum)
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "11:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
      exclude: ["golang.org/x/*"]
    allow:
      - dependency-type: "direct"
    groups:
      gomod-all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "gomod"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # ──────────────────────────────────────────────────────────────
  # 2. GitHub Actions Workflows
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "11:15"
      timezone: "America/New_York"
    cooldown:
      default-days: 3
      exclude: ["actions/*", "github/*", "gitleaks/*", "ossf/*"]
    allow:
      - dependency-type: "direct"
    groups:
      ghactions-all:
        patterns: ["*"]
    open-pull-requests-limit: 10
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "github-actions"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # ──────────────────────────────────────────────────────────────
  # 3. DevContainer (devcontainer.json : base image + features)
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "devcontainers"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "11:30"
      timezone: "America/New_York"
    cooldown:
      default-days: 3
      exclude: ["ghcr.io/devcontainers/features/*"]
    allow:
      - dependency-type: "direct"
    groups:
      devcontainer-all:
        patterns: ["*"]
    open-pull-requests-limit: 5
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "devcontainer"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # ──────────────────────────────────────────────────────────────
  # 4. npm (frontend/package.json – managed by pnpm)
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "master"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "11:45"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    allow:
      - dependency-type: "direct"
    # Each entry holds back a major version the rest of the toolchain can't take yet; minor
    # and patch updates within the current major still arrive. Every entry names its blocker
    # and when to drop it.
    ignore:
      # Babel 8 installs and builds, but babel-plugin-react-compiler 1.0 is a Babel 7 plugin
      # and stops memoizing under it (the render check, test:renders, fails). Drop once the
      # React Compiler supports Babel 8.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      # ESLint 10 is outside the peer range of eslint-plugin-react (^9.7) and
      # eslint-plugin-jsx-a11y (^9). Drop both once those plugins accept ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is outside typescript-eslint's peer range (<6.1.0). Drop once
      # typescript-eslint supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "npm"]
    commit-message:
      prefix: "chore"
      include: "scope"
