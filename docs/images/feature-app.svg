    <rect x="534" y="321" width="2" height="5" rx="1" fill="#C4CAD4"/>
    <text x="604" y="328.5" text-anchor="end" font-size="14" font-weight="600" fill="#E6E8EC">Tue 9:41</text>

    <g filter="url(#shadow)"><rect x="330" y="344" width="282" height="144" rx="10" fill="#262A33"/></g>
    <rect x="330.5" y="344.5" width="281" height="143" rx="9.5" fill="none" stroke="#3A404C"/>
    <text class="mh" x="346" y="366">Waiting for you</text>
    <circle class="pulse" cx="352" cy="385" r="4.5" fill="#8FA4C4"/>
    <text class="mi" x="364" y="390">app #201 · Claude needs approval</text>
    <line x1="342" y1="402.5" x2="600" y2="402.5" stroke="#3A404C"/>
    <text class="mh" x="346" y="422">Review requested</text>
    <text class="mi" x="346" y="446">api #412 · Retry failed webhook…</text>
    <line x1="342" y1="458.5" x2="600" y2="458.5" stroke="#3A404C"/>
    <text class="mi" x="346" y="479">Refresh Now</text>

    <text x="88" y="384" font-size="15.5" fill="#9AA3B2">Close the window, and</text>
    <text x="88" y="406" font-size="15.5" fill="#9AA3B2">Nilbox keeps running</text>
    <text x="88" y="428" font-size="15.5" fill="#9AA3B2">in the menu bar.</text>

    <!-- Tile B: native banners -->
    <rect class="tile" x="644.5" y="228.5" width="611" height="269" rx="18"/>
    <text class="tt" x="668" y="266">Native banners</text>
    <text class="ts" x="668" y="290">Review requests, assignments, early wake-ups, and releases</text>

    <g filter="url(#shadow)"><rect x="668" y="310" width="564" height="80" rx="16" fill="#2A2F3A"/></g>
    <rect x="668.5" y="310.5" width="563" height="79" rx="15.5" fill="none" stroke="#3A4150"/>
    <rect x="684" y="328" width="44" height="44" rx="10" fill="url(#appicon)" stroke="#3A4150"/>
