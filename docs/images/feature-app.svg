    <text class="ts" x="900" y="580">Each check costs no API budget</text>
    <circle cx="908" cy="616" r="5" fill="#3DBE8B"/>
    <text x="924" y="621" font-size="15.5" font-weight="700" fill="#E6E8EC">GitHub</text>
