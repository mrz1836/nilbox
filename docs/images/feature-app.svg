    <rect x="690" y="663" width="70" height="6" rx="3" fill="#B6B0A6"/>
    <rect x="680" y="682" width="140" height="20" rx="4" fill="#FFFFFF" stroke="#E6E1DA"/><rect x="680" y="682" width="3" height="20" fill="#17784F"/>
