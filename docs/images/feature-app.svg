    <text x="744" y="427" font-size="15" font-weight="700" fill="#F2F3F5">Back from snooze</text>
    <text x="1214" y="427" text-anchor="end" font-size="13" fill="#8A93A3">2m ago</text>
    <text x="744" y="448" font-size="14.5" font-weight="600" fill="#C4CAD4">acme-org/search #57</text>
    <text x="744" y="469" font-size="14.5" fill="#AEB5C1">Stream search results to the client</text>

