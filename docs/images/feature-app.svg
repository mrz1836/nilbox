    <path d="M176 712A78 78 0 0 1 332 712" fill="none" stroke="#3DBE8B" stroke-width="13" stroke-linecap="round" stroke-opacity="0.25" filter="url(#glow)" stroke-dasharray="186 400"/>
    <path d="M176 712A78 78 0 0 1 332 712" fill="none" stroke="#3DBE8B" stroke-width="13" stroke-linecap="round" stroke-dasharray="186 400"/>
    <text x="254" y="700" text-anchor="middle" font-size="32" font-weight="800" fill="#F2F3F5">76%</text>
    <text x="254" y="724" text-anchor="middle" font-size="13.5" fill="#8A93A3">GraphQL left</text>

    <!-- Tile D: themes -->
    <rect class="tile" x="464.5" y="518.5" width="391" height="233" rx="18"/>
    <text class="tt" x="488" y="556">Light or dark</text>
    <text class="ts" x="488" y="580">Follow the system, or pin either one</text>
    <rect x="488.5" y="596.5" width="267" height="31" rx="8" fill="#0F1218" stroke="#2F3542"/>
