    <text x="1214" y="335" text-anchor="end" font-size="13" fill="#8A93A3">now</text>
    <text x="744" y="356" font-size="14.5" font-weight="600" fill="#C4CAD4">acme-org/api #412</text>
    <text x="744" y="377" font-size="14.5" fill="#AEB5C1">Retry failed webhook deliveries</text>

    <g filter="url(#shadow)"><rect x="668" y="402" width="564" height="80" rx="16" fill="#2A2F3A"/></g>
