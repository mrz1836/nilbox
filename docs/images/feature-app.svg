<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="800" viewBox="0 0 1320 800" role="img" aria-labelledby="app-title app-desc">
  <title id="app-title">The app: always on, never in the way</title>
  <desc id="app-desc">Five tiles. The menu bar: the Nilbox icon shows a live count, and its menu lists the agent sessions waiting for you, the items asking for your review, and Refresh Now; closing the window keeps Nilbox running there. Native banners: Review requested for acme-org/api #412, and Back from snooze for acme-org/search #57. The API budget: a dial for whichever GitHub budget has the least left, here 76% of GraphQL. Light or dark: follow the system, or pin either theme. Service status: GitHub and Claude operational and OpenAI degraded, each check costing no API budget.</desc>
  <defs>
    <path id="mark" d="M201.8 52L206.2 52C264.3 52 293.4 52 319.6 60.6C358.8 73.4 386.6 101.2 399.4 140.4C408 166.6 408 195.7 408 253.8L408 258.2C408 316.3 408 345.4 399.4 371.6C386.6 410.8 358.8 438.6 319.6 451.4C293.4 460 264.3 460 206.2 460L201.8 460C143.7 460 114.6 460 88.4 451.4C49.2 438.6 21.4 410.8 8.6 371.6C0 345.4 0 316.3 0 258.2L0 253.8C0 195.7 0 166.6 8.6 140.4C21.4 101.2 49.2 73.4 88.4 60.6C114.6 52 143.7 52 201.8 52ZM162.7 126C137.1 126 124.4 126 112.9 129.8C95.6 135.4 83.4 147.6 77.8 164.9C74 176.4 74 189.1 74 214.7L74 297.3C74 322.9 74 335.6 77.8 347.1C83.4 364.4 95.6 376.6 112.9 382.2C124.4 386 137.1 386 162.7 386L245.3 386C270.9 386 283.6 386 295.1 382.2C312.4 376.6 324.6 364.4 330.2 347.1C334 335.6 334 322.9 334 297.3L334 214.7C334 189.1 334 176.4 330.2 164.9C324.6 147.6 312.4 135.4 295.1 129.8C283.6 126 270.9 126 245.3 126L162.7 126ZM320.3 0H407.6L87.7 512H0.4Z"/>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A1F29"/>
      <stop offset="0.55" stop-color="#11141B"/>
      <stop offset="1" stop-color="#0B0D12"/>
    </linearGradient>
    <radialGradient id="ember" cx="660" cy="420" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8743B" stop-opacity="0.13"/>
      <stop offset="0.5" stop-color="#E8743B" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#E8743B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC690"/>
      <stop offset="0.45" stop-color="#F5803F"/>
      <stop offset="1" stop-color="#D24F1B"/>
    </linearGradient>
    <linearGradient id="appicon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262B37"/>
      <stop offset="1" stop-color="#0B0D12"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181C24"/>
      <stop offset="1" stop-color="#12151B"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="frame"><rect width="1320" height="800" rx="28"/></clipPath>
    <clipPath id="tileA"><rect x="64" y="228" width="560" height="270" rx="18"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <style>
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 2.8px; fill: #E8743B; }
    .headline { font-size: 44px; font-weight: 800; letter-spacing: -0.6px; fill: #F2F3F5; }
    .lede { font-size: 19px; fill: #9AA3B2; }
    .lede .b { font-weight: 600; fill: #D5D9E0; }
    .tile { fill: url(#tile); stroke: #2A303C; }
    .tt { font-size: 18px; font-weight: 700; fill: #F2F3F5; }
    .ts { font-size: 15px; fill: #8A93A3; }
    .mi { font-size: 14.5px; fill: #E6E8EC; }
    .mh { font-size: 12.5px; font-weight: 700; fill: #8A93A3; }
    .pulse { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.3; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>

  <!-- Backdrop -->
  <g clip-path="url(#frame)">
    <rect width="1320" height="800" fill="url(#bg)"/>
    <rect width="1320" height="800" fill="url(#dots)"/>
    <rect width="1320" height="800" fill="url(#ember)"/>
  </g>
  <rect x="0.5" y="0.5" width="1319" height="799" rx="27.5" fill="none" stroke="#2A303C"/>

  <!-- Headline -->
  <g class="sans">
    <text class="eyebrow" x="64" y="76">THE APP</text>
    <text class="headline" x="62" y="128">Always on.<tspan dx="14">Never in the way.</tspan></text>
    <text class="lede" x="64" y="166">A live count in the menu bar, native banners, and a dial that watches your GitHub API budget.</text>
    <text class="lede" x="64" y="194">Light or dark, and a check on GitHub, Claude, and OpenAI's status pages that <tspan class="b">costs no budget</tspan>.</text>
  </g>

  <g class="sans">
    <!-- Tile A: menu bar -->
    <rect class="tile" x="64.5" y="228.5" width="559" height="269" rx="18"/>
    <text class="tt" x="88" y="266">Menu bar</text>
    <text class="ts" x="88" y="290">A live count, and who's waiting on you</text>
    <g clip-path="url(#tileA)">
      <rect x="64" y="308" width="560" height="30" fill="#262A33"/>
      <line x1="64" y1="338.5" x2="624" y2="338.5" stroke="#343A46"/>
