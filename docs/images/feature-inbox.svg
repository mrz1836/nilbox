      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="16"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <g id="ok"><circle r="10" fill="#3DBE8B" fill-opacity="0.12" stroke="#3DBE8B" stroke-width="1.8"/><path d="M-4.2 0.3L-1.2 3.3L4.4-2.6" fill="none" stroke="#3DBE8B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="fail"><circle r="10" fill="#F05D5E" fill-opacity="0.12" stroke="#F05D5E" stroke-width="1.8"/><path d="M-3.4-3.4L3.4 3.4M3.4-3.4L-3.4 3.4" stroke="#F05D5E" stroke-width="2" stroke-linecap="round"/></g>
    <g id="wait"><circle r="10" fill="none" stroke="#5B6372" stroke-width="1.6" stroke-dasharray="3.2 3.2"/></g>
    <g id="you"><circle r="10" fill="#E8743B" fill-opacity="0.14" stroke="#E8743B" stroke-width="1.8"/><circle r="3.6" fill="#F5803F"/></g>
    <g id="go"><circle r="10" fill="#3DBE8B" fill-opacity="0.14" stroke="#3DBE8B" stroke-width="1.8"/><circle r="3.6" fill="#3DBE8B"/></g>
  </defs>
  <style>
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 2.8px; fill: #E8743B; }
    .headline { font-size: 44px; font-weight: 800; letter-spacing: -0.6px; fill: #F2F3F5; }
    .lede { font-size: 19px; fill: #9AA3B2; }
    .lede b, .lede .b { font-weight: 600; fill: #D5D9E0; }
    .tab { font-size: 15.5px; fill: #8A93A3; }
    .card { fill: #1A1E27; stroke: #2A303C; }
    .ttl { font-size: 17px; font-weight: 700; fill: #E6E8EC; }
    .by { font-size: 15px; fill: #7D8595; }
    .story { font-weight: 650; }
    .lbl { font-size: 13px; fill: #D5D9E0; }
    .grade { font-size: 11px; font-weight: 800; fill: #C4CAD4; }
    .btn { font-size: 14.5px; font-weight: 700; }
    .num { font-size: 15px; font-weight: 800; fill: #1A0E06; }
    .co-t { font-size: 18px; font-weight: 700; fill: #F2F3F5; }
    .co-d { font-size: 15.5px; fill: #9AA3B2; }
    .pulse { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.3; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>

  <!-- Backdrop -->
  <g clip-path="url(#frame)">
    <rect width="1320" height="764" fill="url(#bg)"/>
    <rect width="1320" height="764" fill="url(#dots)"/>
    <rect width="1320" height="764" fill="url(#ember)"/>
  </g>
  <rect x="0.5" y="0.5" width="1319" height="763" rx="27.5" fill="none" stroke="#2A303C"/>

  <!-- Headline -->
  <g class="sans">
    <text class="eyebrow" x="64" y="76">YOUR INBOX</text>
    <text class="headline" x="62" y="128">Hundreds of repos.<tspan dx="14">One clear inbox.</tspan></text>
    <text class="lede" x="64" y="166">Review requests, your pull requests, and assignments, each card <tspan class="b">read in a second</tspan>.</text>
    <text class="lede" x="64" y="194">Filter with ⌘F. Snooze, dismiss, and pin: <tspan class="b">your triage never leaves your Mac</tspan>.</text>
  </g>

