    <path id="mark" d="M201.8 52L206.2 52C264.3 52 293.4 52 319.6 60.6C358.8 73.4 386.6 101.2 399.4 140.4C408 166.6 408 195.7 408 253.8L408 258.2C408 316.3 408 345.4 399.4 371.6C386.6 410.8 358.8 438.6 319.6 451.4C293.4 460 264.3 460 206.2 460L201.8 460C143.7 460 114.6 460 88.4 451.4C49.2 438.6 21.4 410.8 8.6 371.6C0 345.4 0 316.3 0 258.2L0 253.8C0 195.7 0 166.6 8.6 140.4C21.4 101.2 49.2 73.4 88.4 60.6C114.6 52 143.7 52 201.8 52ZM162.7 126C137.1 126 124.4 126 112.9 129.8C95.6 135.4 83.4 147.6 77.8 164.9C74 176.4 74 189.1 74 214.7L74 297.3C74 322.9 74 335.6 77.8 347.1C83.4 364.4 95.6 376.6 112.9 382.2C124.4 386 137.1 386 162.7 386L245.3 386C270.9 386 283.6 386 295.1 382.2C312.4 376.6 324.6 364.4 330.2 347.1C334 335.6 334 322.9 334 297.3L334 214.7C334 189.1 334 176.4 330.2 164.9C324.6 147.6 312.4 135.4 295.1 129.8C283.6 126 270.9 126 245.3 126L162.7 126ZM320.3 0H407.6L87.7 512H0.4Z"/>
    <path id="spark" d="M0-7C0.9-2.2 2.2-0.9 7 0C2.2 0.9 0.9 2.2 0 7C-0.9 2.2-2.2 0.9-7 0C-2.2-0.9-0.9-2.2 0-7Z"/>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="764" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A1F29"/>
      <stop offset="0.55" stop-color="#11141B"/>
      <stop offset="1" stop-color="#0B0D12"/>
    </linearGradient>
    <radialGradient id="ember" cx="520" cy="470" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8743B" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#E8743B" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#E8743B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC690"/>
      <stop offset="0.45" stop-color="#F5803F"/>
      <stop offset="1" stop-color="#D24F1B"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="frame"><rect width="1320" height="764" rx="28"/></clipPath>
    <clipPath id="c1"><rect x="80" y="318" width="848" height="80" rx="10"/></clipPath>
    <clipPath id="c2"><rect x="80" y="408" width="848" height="80" rx="10"/></clipPath>
    <clipPath id="c3"><rect x="80" y="536" width="848" height="80" rx="10"/></clipPath>
    <clipPath id="c4"><rect x="80" y="626" width="848" height="80" rx="10"/></clipPath>
    <clipPath id="avatar"><circle r="18"/></clipPath>
