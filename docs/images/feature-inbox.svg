<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="764" viewBox="0 0 1320 764" role="img" aria-labelledby="inbox-title inbox-desc">
  <title id="inbox-title">Your inbox: hundreds of repos, one clear inbox</title>
  <desc id="inbox-desc">The Nilbox inbox window with two lists, Review requested and Yours, and four cards. Numbered callouts explain how to read a card: the left edge's color says whose move it is (orange yours, green ready to ship, red blocked, blue an agent is on it); one line says why it's here, such as Re-review, Approved and ready to merge, or 2 of 14 checks failing; a track shows checks, review, and merge with the size underneath; and two buttons hold your next move and one click to hand it to Claude Code or Codex.</desc>
